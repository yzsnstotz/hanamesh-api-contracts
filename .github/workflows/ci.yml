name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --prefix scripts/ci
      - run: python3 scripts/ci/test_gates.py
      - run: python3 scripts/ci/run.py
      - run: npm ci
      - run: npm test
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - run: git diff --check
